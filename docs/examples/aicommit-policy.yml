name: AICommit policy

on:
  pull_request:

permissions:
  contents: read

jobs:
  commit-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --global @hifullmoon/aicommit@^1.4.0
      - name: Validate pull-request commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: aicommit policy check --range="$BASE_SHA..$HEAD_SHA" --output=json
