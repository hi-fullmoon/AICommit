name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: npm-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - name: Verify release
        run: npm run release:npm:check
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
      - name: Pack release
        run: |
          mkdir -p dist
          PACK_FILENAME=$(npm pack --json --pack-destination dist | node -e \
            "let input=''; process.stdin.on('data', c => input += c); process.stdin.on('end', () => process.stdout.write(JSON.parse(input)[0].filename))")
          echo "PACKAGE_TARBALL=./dist/${PACK_FILENAME}" >> "$GITHUB_ENV"
      - name: Publish with npm Trusted Publishing
        run: npm publish "$PACKAGE_TARBALL" --access public --tag "$NPM_DIST_TAG"
        env:
          NPM_DIST_TAG: ${{ contains(github.ref_name, '-') && 'next' || 'latest' }}
