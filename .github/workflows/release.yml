name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag to publish
        required: true
        type: string
      npm_dist_tag:
        description: npm distribution tag
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next

concurrency:
  group: npm-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - name: Verify release
        run: npm run release:npm:check
      - name: Pack release and verify the Homebrew formula
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p dist
          PACK_FILENAME=$(npm pack --json --pack-destination dist | node -e \
            "let input=''; process.stdin.on('data', c => input += c); process.stdin.on('end', () => process.stdout.write(JSON.parse(input)[0].filename))")
          node scripts/release-assets.mjs \
            --tarball "dist/${PACK_FILENAME}" \
            --output dist
          cmp dist/aicommit.rb Formula/aicommit.rb
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
      - name: Publish with npm Trusted Publishing
        run: npm publish "./dist/aicommit-${VERSION}.tgz" --access public --tag "$NPM_DIST_TAG"
        env:
          NPM_DIST_TAG: ${{ inputs.npm_dist_tag || (github.event.release.prerelease && 'next' || 'latest') }}

  verify-homebrew:
    name: Verify Homebrew install
    needs: publish-npm
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}
      - name: Install the published formula from a temporary tap
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew tap-new --no-git aicommit-ci/release
          cp Formula/aicommit.rb "$(brew --repository aicommit-ci/release)/Formula/aicommit.rb"
          HOMEBREW_NO_AUTO_UPDATE=1 brew install --formula aicommit-ci/release/aicommit
          aicommit --version
          aicommit --help >/dev/null
          HOME="$RUNNER_TEMP/aicommit-home" aicommit config validate --output=json
      - name: Uninstall smoke formula
        if: always()
        run: |
          brew uninstall --force aicommit-ci/release/aicommit || true
          brew untap --force aicommit-ci/release || true
