name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: npm-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    name: Quality / Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ci
      - run: npm run test:package

  compatibility:
    name: Compatibility / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 18
          - os: macos-latest
            node: 24
          - os: windows-latest
            node: 24

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:package

  publish-npm:
    name: Publish to npm
    needs: [quality, compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - name: Verify release
        run: node scripts/verify-release.mjs
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
      - name: Pack release
        run: |
          mkdir -p dist
          PACK_FILENAME=$(npm pack --json --pack-destination dist | node -e \
            "let input=''; process.stdin.on('data', c => input += c); process.stdin.on('end', () => process.stdout.write(JSON.parse(input)[0].filename))")
          echo "PACKAGE_TARBALL=./dist/${PACK_FILENAME}" >> "$GITHUB_ENV"
      - name: Publish with npm Trusted Publishing
        run: npm publish "$PACKAGE_TARBALL" --access public --tag "$NPM_DIST_TAG"
        env:
          NPM_DIST_TAG: ${{ contains(github.ref_name, '-') && 'next' || 'latest' }}
